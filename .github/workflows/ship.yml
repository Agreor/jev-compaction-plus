name: Ship

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ship
  cancel-in-progress: false

# The bot runs candidate branches' ci-gates.sh with a write token. Only trusted
# repositories may enable it; protect each branch with branch protection.
jobs:
  ship:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ship'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
      - name: Install runner tools and configure git
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          git config --global user.name ci-bot
          git config --global user.email ci-bot@users.noreply.github.com
      - run: python -m pip install --quiet -r requirements-ci.txt
        if: ${{ hashFiles('requirements-ci.txt') != '' }}
      - name: Merge queued pull requests
        run: bash scripts/ship-queue.sh
